# =============================================================================
# Dummies de regime país-tempo — especificação, metadados e papel no DSGE
# =============================================================================
# Regras de codificação (implementadas em src/macrodata/regimes.py):
#  - start/end em YYYY-MM. Para eventos anuais, usar YYYY-01 e YYYY-12.
#  - `permanent: true` => dummy step = 1 de start até o fim da amostra.
#  - Resolução anual: ano = 1 se houver sobreposição de >= 1 trimestre com o evento.
#  - Resolução trimestral: trimestre = 1 se o evento cobre o trimestre inteiro
#    (>= 2 meses) ou se é um evento pontual declarado em `point: true`.
#  - `countries: [ALL]` expande para os 22 países (não para o agregado EU).
#  - `kind`: monetary | fiscal | crisis_global | crisis_domestic | commodity | methodology
#  - `dsge_role`: observed_shock | parameter_break | control | sample_split
#    * observed_shock: entra como regressor exógeno/choque observável;
#    * parameter_break: quebra de parâmetro (ex.: persistência da Taylor);
#    * control: controle em modelos reduzidos, sem papel estrutural;
#    * sample_split: define amostra, não entra como regressor.
# =============================================================================

events:
