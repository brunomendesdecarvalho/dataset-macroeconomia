  # ---------------------------------------------------------------------------
  - id: g_oil_1973
    name: Primeiro choque do petróleo (embargo da OPEP)
    kind: crisis_global
    scope: global
    countries: [ALL]
    start: 1973-10
    end: 1975-03
    freq: [A, Q]
    source: "História econômica; preço do Brent (FRED POILBREUSDM); NBER recessions"
    url: https://fred.stlouisfed.org/series/POILBREUSDM
    variables: [inflation, gdp_real, oil_price, output_gap, current_account_gdp]
    models: [ADAS, PC, DSGE_S, DSGE_M]
    dsge_role: observed_shock
    dsge_note: "Choque de oferta/oferta de energia; no DSGE médio entra como choque de preço de commodity (pcom) e, no pequeno, como choque de markup."
