# =============================================================================
# Lista fechada de países e grupos — dataset macro cross-country (âncora: Brasil)
# Versão: 1.0.0  |  Corte: 1960–2026 (anual) / 1996–2026 (trimestral)
# =============================================================================
# Regras:
#  - A lista de países é FECHADA: só entram os 22 países abaixo + agregado UE.
#  - O agregado "EU" (União Europeia) NÃO é país e é excluído de somas/médias
#    cross-country para evitar dupla contagem (UE + Estados-membros).
#  - Grupos são sobrepostos de propósito (um país pertence a vários grupos).
#  - "quarterly": True somente se houver PIB trimestral com cobertura estável
#    (>= 60 trimestres) em fonte oficial/FRED-OECD.
# =============================================================================

