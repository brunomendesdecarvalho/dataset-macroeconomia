# -----------------------------------------------------------------------------
# Grupos (listas fechadas). A justificativa metodológica está em
# docs/05_country_groups.md e é repetida aqui em uma linha.
# -----------------------------------------------------------------------------
groups:
  BRICS:
    name: BRICS (composição original)
    members: [BRA, RUS, IND, CHN, ZAF]
    justification: >-
      Composição original do acrônimo (2001) e do bloco formal desde 2009.
      A expansão de 2024 é deliberadamente excluída para manter a lista fechada
      e comparável ao longo de todo o período; novos membros entram apenas se
      já pertencerem a outro grupo do desenho.
  G20:
    name: G20 (países + UE)
    members: [ARG, AUS, BRA, CAN, CHN, FRA, DEU, IND, IDN, ITA, JPN, KOR, MEX, RUS, SAU, ZAF, TUR, GBR, USA, EU]
    justification: >-
      Composição oficial do G20 (19 países + União Europeia). A UE é agregado e
      é excluída de qualquer soma/média de países para evitar dupla contagem.
  G7:
    name: G7
    members: [CAN, FRA, DEU, ITA, JPN, GBR, USA]
    justification: "Composição oficial do G7; economias avançadas de referência."
  TOP10_NOMINAL:
    name: 10 maiores economias — PIB nominal USD (WEO out/2025)
    members: [USA, CHN, DEU, JPN, IND, GBR, FRA, ITA, BRA, CAN]
    justification: >-
      Métrica FIXA: PIB nominal em USD correntes, estimativa WEO de outubro/2025
      para 2025. Inclui o Brasil (âncora). A métrica PPP é reportada apenas como
      variável (gdp_ppp_usd), nunca para redefinir o grupo.
  LATAM6:
    name: América Latina (6 maiores)
    members: [BRA, MEX, ARG, CHL, COL, PER]
    justification: >-
      Seis maiores economias da América Latina por PIB nominal e cobertura
      consistente em GMD/WDI/WEO; bloco solicitado na especificação.
  EMERG_COMP:
    name: Emergentes comparáveis
    members: [BRA, MEX, IND, IDN, TUR, ZAF]
    justification: >-
      Países emergentes de renda média com PIB relevante, regimes monetários
      documentados e cobertura razoável desde 1980; grupo solicitado.
  ADVANCED:
    name: Economias avançadas
    members: [USA, DEU, GBR, JPN, CAN, FRA, ITA, AUS, KOR]
    justification: "Referência de fronteira tecnológica e de política monetária."
  QUARTERLY_CORE:
    name: Núcleo trimestral
    members: [BRA, USA, DEU, GBR, JPN, CAN, MEX, AUS, FRA, ITA, KOR, ZAF, TUR, IDN, ARG, SAU]
    justification: >-
      Países com PIB trimestral encadeado e deflator/CPI trimestral estáveis em
      FRED/OCDE-MEI, IBGE e BCB. O núcleo mínimo solicitado (BRA, USA, DEU, GBR,
      JPN, CAN, MEX) é sempre preservado; os demais entram se cumprirem o
      critério de >= 60 trimestres.
  COMMODITY_EXPORTERS:
    name: Exportadores de commodities
    members: [BRA, ARG, CHL, COL, PER, RUS, SAU, ZAF, IDN, AUS]
    justification: "Para dummies de choque de commodities e termos de troca."
  HIGH_INFLATION_HISTORY:
    name: Histórico de alta inflação
    members: [BRA, ARG, PER, TUR, RUS]
    justification: >-
      Países com inflação anual > 100% em algum momento pós-1960; justifica
      amostra DSGE pós-estabilização e dummies de hiperinflação/planos.
  IT_REGIME:
    name: Regime de metas de inflação (datas em regimes.yml)
    members: [BRA, MEX, CHL, COL, PER, ZAF, TUR, IDN, KOR, GBR, CAN, AUS, DEU, FRA, ITA, EU, USA, JPN, IND, ARG]
    justification: >-
      Regime explícito ou quasi-explícito de meta; usado para dummies monetárias
      e para definir a amostra de estimação. ARG entra apenas 2016–2018.
