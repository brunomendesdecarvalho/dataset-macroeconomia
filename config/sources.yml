# =============================================================================
# Registro de fontes — código original, URL/API, licença, cobertura e vintage
# A data de extração efetiva é gravada em data/processed/manifest.json a cada run.
# =============================================================================
sources:
  GMD:
    name: Global Macro Database (GMD)
    institution: KMueller-Lab / Universidade de Princeton et al.
    version: "2026_09 (release notes de set/2026)"
    url: https://www.globalmacrodb.org
    repository: https://github.com/KMueller-Lab/Global-Macro-Database
    api: "download direto do arquivo Stata data/final/data_final.dta"
    license: "CC BY 4.0 (ver LICENSE do repositório)"
    coverage: "243 países, anual, 1086–2025/26; foco pós-1950; 46 variáveis"
    role: "espinha dorsal anual"
    notes: >-
      Base harmonizada que agrega IMF IFS/WEO/GFS, World Bank WDI, OECD MEI/EO/QNA,
      BIS, PWT, Maddison, Mitchell e fontes históricas. O GMD já resolve o
      pareamento pré-1980; por isso é a espinha dorsal, e não uma fonte primária
      isolada. Cada série traz documentação por país em docs/Countries/*.pdf.
  WDI:
    name: World Development Indicators
    institution: Banco Mundial
    version: "API v2, lastupdated variável por indicador (gravado no manifesto)"
    url: https://data.worldbank.org
    api: "https://api.worldbank.org/v2/country/{iso3}/indicator/{code}?format=json&per_page=20000"
    license: "CC BY 4.0"
    coverage: "217 economias + agregados, anual, 1960–2025/26"
    role: "complemento e validação cruzada"
    notes: "Usado para participação, crédito ao setor privado, carga tributária, dívida central e validação de PIB/inflação/desemprego."
  WEO:
    name: World Economic Outlook Database
    institution: FMI
    version: "outubro/2025 (DataMapper API; campo lastupdated no manifesto)"
    url: https://www.imf.org/en/Publications/WEO/weo-database/2025/October
    api: "https://www.imf.org/external/datamapper/api/v1/{indicator}/{ISO3}"
    license: "Termos de uso do FMI (atribuição)"
    coverage: "1980–2031 (projeções); anual"
    role: "complemento fiscal (resultado primário, dívida líquida) e validação"
    notes: >-
      WEO é usado apenas PÓS-1980, conforme especificação. Anos > 2025 são
      projeções e recebem is_forecast=1; não entram em estimação.
  PWT:
    name: Penn World Table 10.01
    institution: Groningen Growth and Development Centre
    version: "10.01 (2019 como último ano)"
    url: https://www.rug.nl/ggdc/productivity/pwt/
    api: "arquivo pwt1001.dta (espelho no repositório do GMD)"
    license: "CC BY 4.0"
    coverage: "183 países, anual, 1950–2019"
    role: "capital, PTF, emprego, horas, capital humano e participação do trabalho"
    notes: "Última observação em 2019; após 2019 as séries de capital/PTF são estendidas por método documentado (ver codebook)."
  FRED:
    name: Federal Reserve Economic Data
    institution: Federal Reserve Bank of St. Louis
    version: "extração via fredgraph.csv (sem chave); vintage = data de extração"
    url: https://fred.stlouisfed.org
    api: "https://fred.stlouisfed.org/graph/fredgraph.csv?id={series_id}"
    license: "Termos do FRED; séries de terceiros mantêm a licença original"
    coverage: "anual/trimestral/mensal/diária; cobertura por série"
    role: "subamostra trimestral; commodities; VIX; juros dos EUA"
    notes: >-
      As séries trimestrais OECD-MEI e BIS-REER são distribuídas pelo FRED;
      registramos o ID FRED e a fonte original (OECD MEI, BIS) no campo
      source_detail de cada série.
  OECD_MEI:
    name: OECD Main Economic Indicators (via FRED)
    institution: OCDE
    version: "vintage FRED na data de extração"
    url: https://data-explorer.oecd.org
    api: "FRED series IDs CPALTT01*, LRHUTTTT*, IR3TIB01*, IRLTLT01*, NGDPRSAXDC*"
    license: "OECD Terms and Conditions"
    coverage: "trimestral, países OCDE e alguns não membros"
    role: "fonte original das séries trimestrais de CPI, desemprego e juros"
  BIS:
    name: BIS Effective Exchange Rate (via FRED)
    institution: Banco de Compensações Internacionais
    version: "vintage FRED na data de extração"
    url: https://www.bis.org/statistics/eer.htm
    api: "FRED series IDs RB{ISO3}BIS (broad, 2010=100)"
    license: "BIS Terms"
    coverage: "mensal, 1994–presente"
    role: "câmbio real efetivo"
  BCB:
    name: Banco Central do Brasil — Sistema Gerenciador de Séries Temporais (SGS)
    institution: BCB
    version: "vintage na data de extração (SGS não guarda vintages)"
    url: https://www.bcb.gov.br/estatisticas/tabelas
    api: "https://api.bcb.gov.br/dados/serie/bcdata.sgs.{code}/dados?formato=json"
    license: "Dados abertos BCB (atribuição)"
    coverage: "diário/mensal/trimestral/anual; 1980–presente (por série)"
    role: "Brasil: juros, câmbio, IPCA, núcleo, desemprego, crédito, fiscal"
    notes: >-
      SGS não armazena vintages; revisões de PIB, crédito e balanço de pagamentos
      podem alterar o passado. O manifesto registra a data/hora da extração.
  IBGE:
    name: IBGE — SIDRA / Contas Nacionais Trimestrais e IPCA
    institution: IBGE
    version: "SIDRA v3, período final 2026T2 (na extração)"
    url: https://sidra.ibge.gov.br
    api: "https://servicodados.ibge.gov.br/api/v3/agregados/{tabela}/periodos/{periodos}/variaveis/{var}?localidades=N1[all]"
    license: "Dados abertos IBGE (atribuição)"
    coverage: "trimestral 1996–2026 (CNT); mensal 1980–2026 (IPCA)"
    role: "Brasil: PIB trimestral e componentes da despesa; IPCA"
  IMF_IFS:
    name: IMF International Financial Statistics
    institution: FMI
    version: "via GMD (2026_09)"
    url: https://data.imf.org
    license: "IMF Terms"
    coverage: "anual/mensal; histórico longo"
    role: "fonte primária histórica incorporada pelo GMD"
    notes: >-
      A API IFS foi descontinuada/instável em parte do período; usamos a
      harmonização do GMD e validamos com WEO/WDI. Não há acesso direto a IFS
      neste pipeline.
  OECD_EO:
    name: OECD Economic Outlook
    institution: OCDE
    version: "via GMD (2026_09)"
    url: https://data-explorer.oecd.org
    license: "OECD Terms"
    coverage: "anual/semestral, 1960–presente"
    role: "complemento histórico pós-1980 incorporado pelo GMD"
  BACEN_FOCUS:
    name: BCB — Relatório Focus (expectativas de mercado)
    institution: BCB
    version: "vintage na data de extração"
    url: https://www.bcb.gov.br/publicacoes/focus
    api: "https://olinda.bcb.gov.br/olinda/servico/Expectativas/versao/v1/odata/ExpectativasMercadoInflacao12Meses"
    license: "Dados abertos BCB"
    coverage: "Brasil, mensal, 2001–presente (IPCA 12 meses); séries adicionais por indicador"
    role: "expectativas de inflação (survey) para o Brasil"
  MICH:
    name: University of Michigan — Inflation Expectations
    institution: University of Michigan / FRED
    version: "vintage FRED"
    url: https://fred.stlouisfed.org/series/MICH
    license: "Termos FRED/Universidade de Michigan"
    coverage: "EUA, mensal, 1978–presente"
    role: "expectativas de inflação (survey) para os EUA"
