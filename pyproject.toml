[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "macrodata-br"
version = "2.0.0"
description = "Dataset macroeconômico cross-country com âncora Brasil (anual 1960-2026 e trimestral 1995-2026)"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2", "numpy>=1.26", "scipy>=1.12", "statsmodels>=0.14",
  "matplotlib>=3.8", "pyarrow>=15", "PyYAML>=6", "requests>=2.31",
  "x13as>=1.1.62", "openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
